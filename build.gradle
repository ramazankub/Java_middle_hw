plugins {
    id 'java'
    id 'idea'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id("io.freefair.lombok") version "9.2.0"
}

shadowJar {
    archiveClassifier.set('all')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.hibernate.orm:hibernate-platform:6.6.18.Final')

    implementation 'org.hibernate.orm:hibernate-core'
    implementation 'jakarta.persistence:jakarta.persistence-api' // Она тоже есть в платформе Hibernate

    implementation "com.h2database:h2:2.3.232"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.register("printBom") {
    group = "help"
    description = "Print resolved testRuntimeClasspath with BOM versions"

    doLast {
        exec {
            commandLine "./gradlew", "dependencies", "--configuration", "testRuntimeClasspath"
        }
    }
}

test {
    useJUnitPlatform()
}
